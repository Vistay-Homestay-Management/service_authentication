spring:
  application:
    name: vistay-authentication-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vistay_authentication_db}
    username: ${DB_USERNAME:vistay}
    password: ${DB_PASSWORD:vistay}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      schema: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
  flyway:
    enabled: true
    default-schema: app
    schemas: app
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.truststore.location: ${KAFKA_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_TRUSTSTORE_PASSWORD:}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:vistay-authentication}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_BACKOFFICE_ISSUER:http://localhost:8180/realms/vistay-backoffice}
          jwk-set-uri: ${KEYCLOAK_BACKOFFICE_JWKS_URI:http://localhost:8180/realms/vistay-backoffice/protocol/openid-connect/certs}
  grpc:
    client:
      channel:
        user:
          target: ${USER_GRPC_ADDRESS:static://localhost:9090}
          ssl:
            bundle: ${USER_GRPC_SSL_BUNDLE:grpc-user-client}
  ssl:
    bundle:
      pem:
        grpc-user-client:
          keystore:
            certificate: ${GRPC_CLIENT_CERT:file:/run/secrets/grpc/authentication.crt}
            private-key: ${GRPC_CLIENT_KEY:file:/run/secrets/grpc/authentication.key}
          truststore:
            certificate: ${GRPC_SERVER_CA_CERT:file:/run/secrets/grpc/ca.crt}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: logstash

vistay:
  security:
    audience: ${KEYCLOAK_BACKOFFICE_AUDIENCE:vistay-backoffice-api}
  bootstrap:
    token: ${VISTAY_BOOTSTRAP_TOKEN:local-bootstrap-token-change-before-use-1234567890}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    backoffice-realm: ${KEYCLOAK_BACKOFFICE_REALM:vistay-backoffice}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:vistay-auth-facade}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:local-keycloak-client-secret}
  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}
    send-timeout-seconds: ${OUTBOX_SEND_TIMEOUT_SECONDS:10}
  topics:
    authorization-changed: ${AUTHORIZATION_CHANGED_TOPIC:vistay.user.authorization-changed.v1}
  authorization:
    local-cache-ttl: ${AUTHORIZATION_LOCAL_CACHE_TTL:30s}
    grpc-deadline: ${AUTHORIZATION_GRPC_DEADLINE:2s}
